apiVersion: batch/v1
kind: CronJob
metadata:
  name: ddns
  namespace: ddns
  labels:
    app: ddns
    team: me-myself-and-i
spec:
  schedule: "*/5 * * * *"
  # Without an explicit zone Kubernetes schedules in UTC, so a schedule
  # that reads as 3am fires at 11pm the previous evening in ET.
  timeZone: "America/New_York"
  # Forbid: a run that overruns its interval must not have a second copy
  # started alongside it.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A hung job must die rather than block every later run.
      activeDeadlineSeconds: 600
      backoffLimit: 2
      template:
        metadata:
          annotations:
            reloader.stakater.com/secret-reload-on-change: "ddns-secrets"
          labels:
            app: ddns
            team: me-myself-and-i
        spec:
          restartPolicy: Never
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: ddns
          containers:
            - name: ddns
              image: ghcr.io/christopherscot/ddns:latest
              # Stated rather than left to Kubernetes, whose default for a :latest
              # image is Always.
              #
              # This depends on argocd-image-updater pinning the image by digest (see
              # kustomization.yaml). A digest names exactly one image, so a new build
              # arrives as a new reference and is pulled, while an unchanged one is
              # reused from the node's cache. Always would add a registry round trip
              # to every start, and a pod scaling up from zero could not start while
              # the registry was unreachable, even with the image cached.
              #
              # If the pin is missing - the updater has not written one yet, or is
              # skipping this app - the pod runs bare :latest, and a node that already
              # has some :latest keeps it, restart or not. Check the live Application's
              # spec.source.kustomize.images for a digest.
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: ddns-secrets
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 65532
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
          volumes:
            - name: tmp
              emptyDir: {}
